<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Book Catalogue | GLA Central Library</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main-content"><header class="topbar"><button class="menu-btn" onclick="toggleSidebar()">☰</button><div class="heading-block"><div class="eyebrow">COLLECTION</div><h1 class="page-title">Online Book Catalogue</h1></div><div class="top-actions"><span class="role-pill" id="rolePill"></span><button class="icon-btn" onclick="toast('No new notifications')">🔔</button><div class="user-chip"><div class="avatar" id="userAvatar"></div><span id="userName"></span></div></div></header>
<div class="catalog-toolbar"><div class="catalog-search"><span>⌕</span><input id="catalogSearch" placeholder="Search title, author, category or keyword..." oninput="filterCatalogue()"></div><select id="catFilter" onchange="filterCatalogue()"><option>All Categories</option><option>Computer Science</option><option>Electronics</option><option>Mathematics</option></select><select id="availFilter" onchange="filterCatalogue()"><option>All Availability</option><option>Available</option><option>Issued</option><option>Reserved</option><option>Overdue</option></select></div>
<div class="filter-chips"><button class="filter-chip active" onclick="quickCat('all',this)">All</button><button class="filter-chip" onclick="quickCat('Computer Science',this)">Computer Science</button><button class="filter-chip" onclick="quickCat('Available',this)">Available</button><button class="filter-chip" onclick="quickCat('Issued',this)">Issued</button></div>
<div class="meta-line"><span id="count">8 catalogue titles</span><span>Central Library Collection · Odd Semester 2026</span></div><div class="book-grid" id="catalogueGrid"></div></main></div><div class="toast" id="toast"></div><script src="../js/app.js"></script><script>
const catalogue=[
["Database System Concepts","Abraham Silberschatz, Henry Korth","Computer Science","Available","cover-blue","📙","ACC-014812","CS-A3-014"],
["Operating System Concepts","Abraham Silberschatz","Computer Science","Available","cover-green","💻","ACC-014813","CS-A3-016"],
["Computer Networks","Andrew S. Tanenbaum","Computer Science","Issued","cover-orange","🌐","ACC-014814","CS-A4-002"],
["Clean Code: A Handbook of Agile Software Craftsmanship","Robert C. Martin","Computer Science","Available","cover-rose","💻","ACC-014901","CS-A5-001"],
["Engineering Mathematics","R.K. Jain","Mathematics","Available","cover-blue","📐","ACC-014821","M-02-118"],
["Data Structures and Algorithms","Thomas H. Cormen","Computer Science","Available","cover-green","🧩","ACC-014825","CS-A2-007"],
["Digital Logic Design","M. Morris Mano","Electronics","Reserved","cover-orange","⚡","ACC-014831","EC-B1-031"],
["Artificial Intelligence: A Modern Approach","Stuart Russell, Peter Norvig","Computer Science","Available","cover-rose","🤖","ACC-014839","CS-A6-011"]];
function renderCatalogue(a){document.getElementById("catalogueGrid").innerHTML=a.map((b,i)=>`<div class="book-card"><div class="book-cover ${b[4]}">${b[5]}</div><h4>${b[0]}</h4><p>${b[1]}</p><div class="book-meta"><span class="pill">${b[2]}</span><span class="status ${b[3]==='Available'?'success':b[3]==='Issued'?'info':'warning'}">${b[3]}</span></div><div style="font-size:8px;color:#8991a4;margin-bottom:8px">${b[6]} · Shelf ${b[7]}</div><button class="btn btn-primary btn-sm w-100" onclick="catalogAction(${i})">${b[3]==='Available'?'Reserve / Issue':'View Details'}</button></div>`).join("");document.getElementById("count").textContent=a.length+" catalogue titles"}
function filterCatalogue(){let q=(document.getElementById("catalogSearch").value||"").toLowerCase(),c=document.getElementById("catFilter").value,a=document.getElementById("availFilter").value;renderCatalogue(catalogue.filter(b=>(!q||b.join(" ").toLowerCase().includes(q))&&(c==="All Categories"||b[2]===c)&&(a==="All Availability"||b[3]===a)))}
function quickCat(v,btn){document.querySelectorAll(".filter-chip").forEach(x=>x.classList.remove("active"));btn.classList.add("active");if(v==="all"){document.getElementById("catFilter").value="All Categories";document.getElementById("availFilter").value="All Availability"}else if(["Available","Issued"].includes(v)){document.getElementById("availFilter").value=v}else{document.getElementById("catFilter").value=v}filterCatalogue()}
function catalogAction(i){const b=catalogue[i];if(b[3]==="Available")toast(b[0]+" added to your reservation queue");else toast("Opening catalogue details for "+b[0])}
document.addEventListener("DOMContentLoaded",()=>{const p=new URLSearchParams(location.search);if(p.get("q"))document.getElementById("catalogSearch").value=p.get("q");filterCatalogue()});
</script></body></html>
