<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Desk Catalogue Search | GLA Central Library</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main-content"><header class="topbar"><button class="menu-btn" onclick="toggleSidebar()">☰</button><div class="heading-block"><div class="eyebrow">CIRCULATION</div><h1 class="page-title">Circulation Desk Catalogue Search</h1></div><div class="top-actions"><span class="role-pill" id="rolePill"></span><button class="icon-btn" onclick="toast('No new notifications')">🔔</button><div class="user-chip"><div class="avatar" id="userAvatar"></div><span id="userName"></span></div></div></header>
<div class="catalog-toolbar"><div class="catalog-search"><span>⌕</span><input id="deskSearch" oninput="searchDesk()" placeholder="Search by title, author or accession number"></div><select><option>All Availability</option><option>Available</option><option>Issued</option><option>Reserved</option></select></div><div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>ACCESSION</th><th>BOOK</th><th>AUTHOR</th><th>CATEGORY</th><th>SHELF</th><th>STATUS</th></tr></thead><tbody id="deskRows"></tbody></table></div></div></main></div><div class="toast" id="toast"></div><script src="../js/app.js"></script><script>const desk=[["ACC-014812","Database System Concepts","Silberschatz, Korth","Computer Science","CS-A3-014","Available"],["ACC-014813","Operating System Concepts","Silberschatz","Computer Science","CS-A3-016","Available"],["ACC-014814","Computer Networks","Tanenbaum","Computer Science","CS-A4-002","Issued"],["ACC-014901","Clean Code","Robert C. Martin","Computer Science","CS-A5-001","Available"],["ACC-014821","Engineering Mathematics","R.K. Jain","Mathematics","M-02-118","Available"]];function searchDesk(){let q=document.getElementById("deskSearch").value.toLowerCase();document.getElementById("deskRows").innerHTML=desk.filter(x=>x.join(" ").toLowerCase().includes(q)).map(x=>`<tr><td>${x[0]}</td><td><strong>${x[1]}</strong></td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td><td><span class="status ${x[5]==='Available'?'success':'info'}">${x[5]}</span></td></tr>`).join("")}document.addEventListener("DOMContentLoaded",searchDesk)</script></body></html>
