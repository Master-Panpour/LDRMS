<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reports & Audit | GLA Central Library</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main-content"><header class="topbar"><button class="menu-btn" onclick="toggleSidebar()">☰</button><div class="heading-block"><div class="eyebrow">ADMINISTRATION</div><h1 class="page-title">System Reports & Audit Center</h1></div><div class="top-actions"><span class="role-pill" id="rolePill"></span><button class="icon-btn" onclick="toast('No new notifications')">🔔</button><div class="user-chip"><div class="avatar" id="userAvatar"></div><span id="userName"></span></div></div></header>
<div class="panel"><div class="panel-head"><div><h3>Report Criteria</h3><p>Generate official circulation, collection and member reports</p></div></div><div class="form-grid"><div class="field"><label>Report Type</label><select><option>Circulation Audit & Transactions</option><option>Catalogue Inventory Status</option><option>Member Borrowing & Standing</option><option>Digital Repository Access Log</option><option>Overdue & Penalty Statement</option></select></div><div class="field"><label>Department / School</label><select><option>All Departments</option><option>Computer Science & Engineering</option><option>Electronics & Communication</option><option>Mathematics & Humanities</option></select></div><div class="field"><label>From Date</label><input type="date" value="2026-09-01"></div><div class="field"><label>To Date</label><input type="date" value="2026-09-19"></div></div><button class="btn btn-primary" style="margin-top:15px" onclick="toast('Report generated in this frontend demo')">Generate Report</button></div>
<div class="grid-3" style="margin-top:17px"><div class="metric-box"><strong>8</strong><small>Verified catalogue titles</small></div><div class="metric-box"><strong>6</strong><small>Digital resources indexed</small></div><div class="metric-box"><strong>5</strong><small>Member records shown</small></div></div>
